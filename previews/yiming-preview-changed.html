<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易命术·预告效果预览（改后）</title>
<style>
  body { margin:0; background:#f0ece4; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .phone { max-width:420px; margin:24px auto; background:#fff; padding:24px 20px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .note { font-size:12px; color:#887F6A; line-height:1.7; margin:0 0 18px; padding:10px 12px; background:#F7F3EA; border-radius:6px; }
  /* 易命术 其余组件维持原样（卷色）示意 */
  .series-kicker { text-align:center; font-size:13px; color:#B0392E; letter-spacing:2px; margin:18px 0 6px; }
  .vol-name { text-align:center; padding:14px 18px; margin:10px 0 22px; border:1px solid #F7E9E6; border-left:4px solid #B0392E; border-radius:6px; background:#fff; font-size:18px; font-weight:700; color:#3a2a28; }
</style>
</head>
<body>
<div class="phone">

  <p class="note">下方为「易命术·新中式沉静」预设下，<b>预告</b>组件改后的效果（竖排书卷式，朱砂红），其余组件（卷色 kicker、术名块、卷色手记）维持原样。</p>

  <!-- 易命术 系列 kicker（维持原样 · 卷色） -->
  <div class="series-kicker">易命术 · 卷五 · 修心与终局</div>
  <div class="vol-name">易命二十八术 · 心不筑牢</div>

  <!-- ⬇⬇⬇ 改后的「预告」：nextPreview 三部分（竖排书卷式，易命朱砂红） ⬇⬇⬇ -->
  <section style="margin-top:30px;padding:20px;background-color:#FDF8F8;border-radius:12px;border:none;overflow:hidden">
    <table style="width:100%;border-collapse:collapse"><tr>
      <td style="width:1%;white-space:nowrap;vertical-align:top;padding:8px 5px 8px 3px;border-right:1px solid #F7E9E6;writing-mode:vertical-rl;text-orientation:upright;font-size:14px;color:#B0392E;letter-spacing:3px">下期预告</td>
      <td style="vertical-align:top;padding:4px 4px 4px 12px">
        <!-- ① 预告标题 -->
        <div class="np-head" style="font-size:16px;color:#B0392E;font-weight:500;margin-bottom:10px;letter-spacing:1px">易命四十二术·逐成者务修者</div>
        <!-- ② 预告内容 -->
        <div class="np-body" style="font-size:14.5px;color:#554a3d;line-height:1.8;margin-bottom:12px">越急着要结果的人，越容易把路走歪——修己的人，反而先到终点。</div>
        <!-- ③ 引导关注（单独换行 + 主题色 + 顶部分隔线） -->
        <div class="np-follow" style="font-size:13px;color:#B0392E;letter-spacing:1px;margin-top:14px;padding-top:12px;border-top:1px solid #F7E9E6">关注我，一起读懂改运的底层逻辑。</div>
      </td>
    </tr></table>
  </section>
  <!-- ⬆⬆⬆ 以上为改后预告 ⬆⬆⬆ -->

  <!-- 注释无背景 (noteNoBg) — 易命默认文末说明 -->
  <div style="margin-top:24px;">
    <div style="height:1px;background:#E6E2D3;margin-bottom:12px;"></div>
    <div style="font-size:12.5px;color:#887F6A;line-height:1.7;letter-spacing:.3px;">（这一术出自小说《改运奇书》，本文只做观点层面的借用与生活化的再解读，不涉及小说情节。）</div>
  </div>

  <!-- 易命术 卷色手记署名（维持原样） -->
  <div style="text-align:center;font-size:13px;color:#B0392E;letter-spacing:1px;margin-top:30px">易命术手记 · 卷五</div>

</div>
</body>
</html>
