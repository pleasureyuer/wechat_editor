<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清新浅青治愈 · 主题组件预览</title>
<style>
  body{margin:0;background:#dfeae8;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .phone{max-width:390px;margin:24px auto;background:#F4FAF8;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.12);overflow:hidden;}
  .topbar{background:#628888;color:#fff;text-align:center;font-size:13px;letter-spacing:2px;padding:10px;}
  .paper{padding:20px 18px 30px;color:#445959;font-size:15px;line-height:1.8;}
  .tag{display:inline-block;font-size:11px;color:#749999;background:#E6F2EF;border-radius:4px;padding:2px 8px;margin:14px 0 6px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">清新浅青治愈 · 情感随笔 / 情绪疗愈</div>
  <div class="paper">

    <div class="tag">一级标题 · 居中标题</div>
    <div style="text-align:center;font-weight:bold;border-bottom:2px solid #628888;padding-bottom:6px;font-size:20px;color:#445959;margin-bottom:10px">当情绪决堤时，先别急着堵</div>

    <div class="tag">分段小标题 · 箭头标题</div>
    <div style="margin:6px 0 10px"><span style="color:#628888;font-weight:bold">→</span> <span style="font-weight:bold;color:#445959">三个信号提醒你该停下来</span></div>

    <div class="tag">分段小标题 · 圆点横线标题</div>
    <div style="color:#A3C9B8;font-weight:bold;margin:6px 0 10px">●————————————— 圆点横线小标题</div>

    <div class="tag">知识点 · 圆形图标标题</div>
    <div style="margin:6px 0 10px"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#628888;color:#fff;font-size:12px;font-weight:bold;margin-right:8px">💡</span><span style="font-weight:bold;color:#445959">一个温柔的小练习</span></div>

    <div class="tag">开篇导语 · 引用主题色导语卡片</div>
    <div style="border-left:3px solid #628888;background:#E6F2EF;padding:10px 14px;color:#445959;font-size:15px;line-height:1.8;border-radius:0 6px 6px 0;margin:6px 0 10px">有些情绪不是问题，只是身体在替你说话。</div>

    <div class="tag">情绪感悟 · 圆弧卷色引用框</div>
    <div style="border:1px solid #D4A373;border-radius:0 12px 12px 0;padding:12px 16px;color:#445959;border-left:3px solid #D4A373;background:#F4FAF8;margin:6px 0 10px">你不需要立刻好起来，允许自己慢慢来。</div>

    <div class="tag">柔线分割</div>
    <div style="width:100%;height:1px;background:linear-gradient(to right,transparent,#628888,transparent);margin:18px 0"></div>

    <div class="tag">结尾交流 · 互动提问框</div>
    <div style="background:#E6F2EF;border-radius:10px;padding:14px;margin:6px 0 4px"><div style="background:#fff;border-radius:6px;padding:12px;text-align:center"><div style="color:#628888;font-size:12px;letter-spacing:1px">· 互动话题 ·</div><div style="color:#445959;margin-top:6px">你最近一次情绪决堤，是因为哪件事？</div></div></div>

  </div>
</div>
</body>
</html>
